<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Pihu ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:'Quicksand', sans-serif;
  background:linear-gradient(to bottom, #ffe6ee, #fff);
  overflow-x:hidden;
}
.container{
  max-width:720px;
  margin:auto;
  padding:30px 20px;
  text-align:center;
}
h1{
  color:#ff4d79;
  font-size:32px;
}
.type{
  font-size:18px;
  min-height:120px;
  margin:20px 0;
}
.card{
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  margin:30px 0;
}
button{
  padding:15px 30px;
  border:none;
  border-radius:30px;
  background:#ff4d79;
  color:white;
  font-size:16px;
  cursor:pointer;
}
button:hover{opacity:0.85;}
.countdown{
  font-size:18px;
  color:#ff4d79;
  margin-top:20px;
}
footer{
  margin-top:30px;
  font-size:16px;
}
.heart{
  position:fixed;
  bottom:-10px;
  font-size:20px;
  animation:float 6s linear infinite;
}
@keyframes float{
  0%{transform:translateY(0); opacity:1;}
  100%{transform:translateY(-100vh); opacity:0;}
}
</style>
</head>

<body>

<div class="container">
  <h1>Pihu 💕</h1>

  <div class="type" id="typewriter"></div>

  <div class="card">
    <p>
      Tum meri life ka wo hissa ho<br>
      jiske bina sab adhoora lagta hai 🥹<br><br>

      Jab tum muskuraati ho na,<br>
      duniya automatically better lagne lagti hai 💖<br><br>

      Main promise karta hoon,<br>
      tumhara saath har haal mein nibhaunga ✨
    </p>
  </div>

  <button onclick="alert('I LOVE YOU PIHU ❤️')">
    Will you be my Valentine? 💘
  </button>

  <div class="countdown" id="timer"></div>

  <footer>
    Hamesha tumhara,<br>
    <b>— Rasmalai 💕</b>
  </footer>
</div>

<!-- Floating Hearts -->
<script>
function createHeart(){
  const heart = document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (16 + Math.random()*20) + "px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,500);
</script>

<!-- Typewriter Text -->
<script>
const text = [
  "Hey Pihu 🫶🏻",
  "Tum ho toh sab kuch sahi lagta hai…",
  "Fakira sa dil bhi tumhare saath ghar jaisa lagta hai 🥹",
  "Tum ho toh lagta hai jaise sab mil gaya ho 💖",
  "Heer ke liye Ranjha jaisa… bas tum hi tum ❤️"
];

let i=0, j=0;
const speed=50;
const element=document.getElementById("typewriter");

function type(){
  if(j < text[i].length){
    element.innerHTML += text[i][j];
    j++;
    setTimeout(type, speed);
  } else {
    setTimeout(()=>{
      element.innerHTML="";
      j=0;
      i=(i+1)%text.length;
      type();
    },1800);
  }
}
type();
</script>

<!-- Countdown -->
<script>
const valentine = new Date("Feb 14, 2026 00:00:00").getTime();
const timer = document.getElementById("timer");

setInterval(()=>{
  const now = new Date().getTime();
  const diff = valentine - now;

  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const m = Math.floor((diff % (1000*60*60)) / (1000*60));
  const s = Math.floor((diff % (1000*60)) / 1000);

  timer.innerHTML = `Valentine ka countdown 💝<br>
  ${d}d ${h}h ${m}m ${s}s`;
},1000);
</script>

<!-- Music -->
<iframe style="display:none"
src="https://youtube.com/shorts/ZtghLWpqbEM?si=e0bLehHKmFwEK2TL">
</iframe>

</body>
</html>
